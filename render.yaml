services:
  - type: web
    name: altag-schedule-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: TIMEZONE
        value: Asia/Barnaul
      - key: DATABASE_URL
        sync: false
      - key: WEBHOOK_PATH
        value: /telegram/webhook
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: SYNC_INTERVAL_HOURS
        value: "6"
